<div class="bg-light min-vh-100 d-flex flex-row align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9 col-xl-6">
          <div class="card mx-4">
            <div class="card-body p-4">
              <form #myForm="ngForm" (ngSubmit)="modifierProduit(myForm)">
                <h1>Modifier Produit</h1>
                <p class="text-medium-emphasis">Modifier un produit</p>
                
                <div class="mb-3">
                  <label for="nomproduit" class="form-label">Nom du produit</label>
                  <input type="text" id="nomproduit" [ngModel]="produit?.nomproduit" name="nomproduit" class="form-control" placeholder="Nom du produit" required>
                </div>
                
                <div class="mb-3">
                  <label for="modele" class="form-label">Modèle</label>
                  <input type="text" id="modele" [ngModel]="produit?.modele" name="modele" class="form-control" placeholder="Modèle" required>
                </div>
  
                <!-- Autres champs du formulaire -->
  
                <div class="mb-3">
                  <label for="image" class="form-label">URL de l'image</label>
                  <input type="text" id="image" [ngModel]="produit?.image" name="image" class="form-control" placeholder="URL de l'image">
                </div>
                
                <div class="mb-3">
                  <label for="prixproduit" class="form-label">Prix du produit</label>
                  <input type="number" id="prixproduit" [ngModel]="produit?.prixproduit" name="prixproduit" class="form-control" placeholder="Prix du produit" required>
                </div>
  
                <!-- Ajoutez d'autres champs du formulaire au besoin -->
  
                <div class="btn-ajouter">
                  <button type="submit" class="btn btn-success">Modifier</button>
                </div>
              </form>
            </div>
          </div> 
        </div>
      </div>
    </div>
  </div>
