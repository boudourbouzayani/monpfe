<!-- panier.component.html -->

<div>
    <h1>Ajouter un produit au panier</h1>
    
    <!-- Formulaire pour saisir l'ID du produit et de panier -->
    <form #form="ngForm" (ngSubmit)="ajouterProduit(form)">
      <label for="idProduit">ID du produit :</label>
      <input type="number" id="idProduit" name="idProduit" ngModel required>
      
      <label for="idPanier">ID du panier :</label>
      <input type="number" id="idPanier" name="idPanier" ngModel required>
      
      <button type="submit">Ajouter au panier</button>
    </form>
  </div>
